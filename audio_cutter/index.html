<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Audio Cutter — 音訊精準剪裁工具</title>
<style>
:root{--bg:#101216;--panel:#191d23;--panel2:#20252d;--line:#2b323c;--txt:#e9ecf1;--dim:#98a2ae;--acc:#4fc3f7;--acc2:#ffb74d;--ok:#7bc97f;--warn:#ef7b7b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.45;overscroll-behavior:none}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 60px}
header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.app .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:8px;padding-bottom:8px}
h1{font-size:17px;margin:0;font-weight:700}
h1 span{color:var(--acc)}
#fileInfo{font-size:12px;color:var(--dim);text-align:right;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.card h2{font-size:13px;margin:0 0 8px;color:var(--acc);letter-spacing:.05em;text-transform:uppercase}
button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 13px;font-size:14px;min-height:42px;cursor:pointer;touch-action:manipulation}
button:active{background:#2a3140}
button.primary{background:#0e3a52;border-color:#15628c;color:#dff3ff}
button.warnbtn{border-color:#5c2b2b;color:var(--warn)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input[type=text],select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 10px;font-size:14px;min-height:42px}
input[type=text]{font-family:ui-monospace,Consolas,monospace}
label.chk{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
#dropzone{border:2px dashed #3a4450;border-radius:12px;text-align:center;padding:34px 16px;color:var(--dim);margin-top:10px;transition:.15s;cursor:pointer}
#dropzone.hot{border-color:var(--acc);color:var(--acc);background:#12222c}
#dropzone b{color:var(--txt);font-size:16px;display:block;margin-bottom:6px}
.cvbox{position:relative;background:#0b0d11;border:1px solid var(--line);border-radius:8px;overflow:hidden}
canvas{display:block;width:100%;touch-action:none}
#overview{height:56px;cursor:pointer}
#maincv{height:240px;cursor:crosshair}
.hintbar{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
#timedisp{font-family:ui-monospace,Consolas,monospace;font-size:18px;text-align:center;margin:8px 0 2px}
#timedisp .cur{color:var(--acc2);font-size:26px}
#timedisp .tot{color:var(--dim);font-size:14px}
.transport{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.transport button{min-width:56px}
.transport button.big{min-width:96px;min-height:52px;font-size:18px}
.segitem{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.segitem:last-child{border-bottom:none}
.segitem .idx{color:var(--acc2);font-family:ui-monospace,monospace;width:28px}
.segitem input{width:112px;padding:7px 8px;min-height:38px;font-size:13px}
.segitem .dur{color:var(--dim);font-size:12px;min-width:62px;text-align:right}
.segitem button{min-height:38px;padding:6px 10px}
#prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:8px}
#progbar{height:100%;width:0;background:var(--acc);transition:width .2s}
#busy{position:fixed;inset:0;background:rgba(8,10,13,.85);display:none;align-items:center;justify-content:center;z-index:99;flex-direction:column;gap:12px}
#busy.show{display:flex}
.spin{width:38px;height:38px;border:4px solid #334;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:12px;color:var(--dim);margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#26303c;color:var(--txt);border:1px solid var(--line);padding:10px 18px;border-radius:10px;z-index:100;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
@media(min-width:760px){#maincv{height:300px}.transport{gap:10px}}
</style>
</head>
<body>
<div id="busy"><div class="spin"></div><div id="busyMsg">處理中…</div></div>
<div class="toast" id="toast"></div>

<header class="app"><div class="wrap">
<h1>🎧 Audio <span>Cutter</span> 音訊精準剪裁</h1>
<div id="fileInfo">未載入音訊</div>
</div></header>

<div class="wrap">

<div id="dropzone">
<b>將音訊檔拖到呢度（或撳一下揀檔）</b>
支援 MP3 · M4A/AAC · WAV · OGG/OPUS（WhatsApp 語音）
<input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.opus,.amr" hidden>
<button class="primary" id="pickBtn" style="margin-top:10px">📂 揀選音訊檔</button>
</div>

<div class="card" id="waveCard" style="display:none">
<h2>Waveform 時間線</h2>
<div class="cvbox"><canvas id="overview"></canvas></div>
<div class="cvbox" style="margin-top:8px"><canvas id="maincv"></canvas></div>
<div class="hintbar"><span id="viewRange"></span><span>拖曳＝平移 · 撳一下＝定位 · 雙指／滾輪＝縮放</span></div>

<div id="timedisp"><span class="cur" id="tCur">0:00:00.000</span> <span class="tot">/ <span id="tTot">0:00:00</span></span></div>

<div class="transport">
<button id="back5" title="後退 5 秒">⏪5s</button>
<button id="back1" title="後退 1 秒">⏪1s</button>
<button id="playBtn" class="big primary" title="播放 / 暫停（空白鍵）">▶</button>
<button id="fwd1" title="前進 1 秒">1s⏩</button>
<button id="fwd5" title="前進 5 秒">5s⏩</button>
</div>

<div class="row" style="margin-top:8px">
<button id="zoomOut">🔍−</button>
<button id="zoomIn">🔍+</button>
<button id="zoomFit">⤢ 全覽</button>
<label class="chk"><input type="checkbox" id="followChk" checked>播放時自動跟線</label>
</div>

<div class="row" style="margin-top:8px">
<input type="text" id="timeJump" placeholder="h:mm:ss.mmm / mm:ss / 秒 / 毫秒ms" class="grow" inputmode="decimal">
<button id="jumpBtn" class="primary">📍 跳轉</button>
</div>
<div class="note">例：<code>1:23:45.5</code>（1小時23分45.5秒）、<code>12:30.25</code>、<code>95.2</code>（95.2秒）、<code>123456ms</code>（毫秒）</div>
</div>

<div class="card" id="markCard" style="display:none">
<h2>切點 Marking</h2>
<div class="row">
<button id="addMarkBtn" class="primary">🚩 喺 cursor 加 Marker</button>
<button id="segsFromMarksBtn">⚙ 由 Markers 生成段落</button>
<button id="clearMarksBtn" class="warnbtn">清除 Marker</button>
</div>
<div class="row" style="margin-top:8px">
<button id="setA">設 A 點</button><button id="setB">設 B 點</button>
<button id="loopBtn">🔁 A–B 循環預覽</button>
<button id="segFromAB" class="primary">➕ A–B 加入段落</button>
</div>
<div class="note" id="regionInfo" style="margin-top:8px">A/B 區間：未設定</div>
<div id="markList" class="note"></div>
</div>

<div class="card" id="exportCard" style="display:none">
<h2>段落清單與匯出</h2>
<div class="row">
<button id="clearSegs" class="warnbtn">清空段落</button>
<span class="note" id="segCount" style="margin:0">尚未有段落</span>
</div>
<div id="segList" style="margin-top:8px"></div>
<div class="row" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
<span class="note" style="margin:0">格式：</span>
<label class="chk"><input type="radio" name="fmt" value="mp3" checked>MP3</label>
<select id="kbps"><option value="128">128 kbps</option><option value="192" selected>192 kbps</option><option value="320">320 kbps</option></select>
<label class="chk"><input type="radio" name="fmt" value="wav">WAV（離線可用）</label>
</div>
<button id="exportBtn" class="primary" style="width:100%;margin-top:10px;min-height:50px;font-size:16px">⬇️ 一次過匯出全部段落</button>
<div id="prog"><div id="progbar"></div></div>
<div class="note" id="expStatus"></div>
<div class="note">MP3 編碼器首次使用需連網載入；離線請改用 WAV 格式。</div>
</div>

</div>
<script>
'use strict';
/* ================= 全域狀態 ================= */
let audioBuf=null,baseName='audio',fileSize=0;
let peaksMin=null,peaksMax=null;const BLOCK=256;
let view={start:0,end:0};
let cursorSec=0;
let playing=false,srcNode=null,gainNode=null,actx=null,startCtxT=0,offAtStart=0,manualStop=false;
let markers=[];
let region={a:null,b:null},loopAB=false;
let segments=[];

/* ================= DOM 快取 ================= */
const $=id=>document.getElementById(id);
const dropzone=$('dropzone'),fileInput=$('fileInput'),mainCv=$('maincv'),ovCv=$('overview');

/* ================= 小工具 ================= */
function pad(n,w){n=String(n);while(n.length<w)n='0'+n;return n;}
function fmt(sec){sec=Math.max(0,sec||0);const base=Math.floor(sec);let ms=Math.round((sec-base)*1000),s=Math.floor(base%60),m=Math.floor(base%3600/60),h=Math.floor(base/3600);if(ms===1000){ms=0;s+=1;if(s===60){s=0;m+=1;}}return h+':'+pad(m,2)+':'+pad(s,2)+'.'+pad(ms,3);}
function fmtShort(sec){return fmt(sec).replace(/^0:/,'');}
function fmtStamp(sec){sec=Math.max(0,sec||0);const base=Math.floor(sec);const ms=Math.round((sec-base)*1000),s=Math.floor(base%60),m=Math.floor(base%3600/60),h=Math.floor(base/3600);return (h?h+'h':'')+m+'m'+pad(s,2)+'s'+pad(ms,3);}
function parseTime(str){if(!str)return null;str=String(str).trim().replace(',','.');if(!str)return null;let m;
 if(m=str.match(/^(\d+(?:\.\d+)?)\s*ms$/i))return parseFloat(m[1])/1000;
 if(m=str.match(/^(?:(\d+):)?(?:(\d{1,2}):)?(\d{1,2}(?:\.\d+)?)$/)){const h=m[1]?parseInt(m[1],10):0,mi=m[2]?parseInt(m[2],10):0;return h*3600+mi*60+parseFloat(m[3]);}
 return null;}
let toastTimer=0;
function toast(msg,long){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),long?5200:2600);}
function busy(on,msg){$('busy').classList.toggle('show',!!on);if(msg)$('busyMsg').textContent=msg;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ================= 檔案載入與解碼 ================= */
$('pickBtn').addEventListener('click',()=>fileInput.click());
dropzone.addEventListener('click',e=>{if(e.target===dropzone)fileInput.click();});
['dragover','dragenter'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>dropzone.addEventListener(ev,e=>{e.preventDefault();dropzone.classList.remove('hot');}));
dropzone.addEventListener('drop',e=>{const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)loadFile(f);});
fileInput.addEventListener('change',()=>{if(fileInput.files[0])loadFile(fileInput.files[0]);});

async function loadFile(f){
 busy(true,'解碼音訊中…');
 try{
  stopNode();playing=false;$('playBtn').textContent='▶';
  baseName=f.name.replace(/\.[^.]+$/,'')||'audio';fileSize=f.size;
  const ab=await f.arrayBuffer();
  ensureAC();
  const buf=await actx.decodeAudioData(ab);
  audioBuf=buf;cursorSec=0;markers=[];region={a:null,b:null};loopAB=false;segments=[];$('loopBtn').textContent='🔁 A–B 循環預覽';
  busy(true,'建立波形索引…');await sleep(30);
  buildPeaks(buf);
  view={start:0,end:buf.duration};
  $('fileInfo').textContent=f.name+' · '+fmtShort(buf.duration)+' · '+buf.sampleRate+' Hz · '+buf.numberOfChannels+' ch'+(fileSize>1048576?' · '+(fileSize/1048576).toFixed(1)+' MB':'');
  $('tTot').textContent=fmtShort(buf.duration);
  dropzone.style.display='none';
  ['waveCard','markCard','exportCard'].forEach(id=>$(id).style.display='block');
  renderMarks();renderSegs();updateRegionInfo();
  resizeAll();
  if(buf.duration>7200)toast('⚠️ 音檔超過 2 小時，操作可能較慢',true);
  toast('✅ 已載入：'+f.name);
 }catch(err){
  console.error(err);
  alert('解碼失敗：'+(err&&err.message?err.message:err)+'\n可能係唔支援嘅格式，請試下轉做 MP3 / M4A 再入。');
 }finally{busy(false);}
}
function ensureAC(){
 if(!actx){const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();gainNode=actx.createGain();gainNode.connect(actx.destination);}
 if(actx.state==='suspended')actx.resume();
 return actx;
}
function buildPeaks(buf){
 const n=Math.max(1,Math.ceil(buf.length/BLOCK));
 peaksMin=new Float32Array(n);peaksMax=new Float32Array(n);
 const nch=Math.min(buf.numberOfChannels,2),datas=[];
 for(let c=0;c<nch;c++)datas.push(buf.getChannelData(c));
 for(let i=0;i<n;i++){
  const s=i*BLOCK,e=Math.min(s+BLOCK,buf.length);let mn=Infinity,mx=-Infinity;
  for(let d=0;d<datas.length;d++){const arr=datas[d];for(let j=s;j<e;j++){const v=arr[j];if(v<mn)mn=v;if(v>mx)mx=v;}}
  if(!isFinite(mn)){mn=0;mx=0;}
  peaksMin[i]=mn;peaksMax[i]=mx;
 }
}
/* ================= Canvas 尺寸 ================= */
function fitCanvas(cv){
 const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 const w=Math.max(1,Math.round(r.width*dpr)),h=Math.max(1,Math.round(r.height*dpr));
 if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
 return dpr;
}
function resizeAll(){fitCanvas(mainCv);fitCanvas(ovCv);drawMain();drawOv();}
window.addEventListener('resize',()=>{if(audioBuf)resizeAll();});

/* ================= 主畫布繪圖 ================= */
function niceStep(target){
 const steps=[0.001,0.002,0.005,0.01,0.02,0.05,0.1,0.2,0.5,1,2,5,10,15,30,60,120,300,600,900,1800,3600];
 for(const s of steps)if(target/s<=9)return s;
 return 3600;
}
function fmtTick(sec,step){
 if(step>=1)return Math.floor(sec/3600)+':'+pad(Math.floor(sec%3600/60),2)+':'+pad(Math.round(sec%60),2);
 if(step>=0.1)return fmtShort(Math.round(sec*10)/10);
 return fmtShort(Math.round(sec*100)/100);
}
function vLine(ctx,x,color,H,dpr){ctx.strokeStyle=color;ctx.lineWidth=Math.max(1,dpr);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
function drawMain(){
 const dpr=fitCanvas(mainCv),ctx=mainCv.getContext('2d'),W=mainCv.width,H=mainCv.height;
 ctx.clearRect(0,0,W,H);
 if(!audioBuf)return;
 const s0=view.start,s1=view.end,dur=Math.max(1e-6,s1-s0),mid=H*0.55,amp=H*0.42;
 const xOf=t=>(t-s0)/dur*W,tOf=x=>s0+x/W*dur;
 /* 時間刻度 */
 const step=niceStep(dur/(W/dpr));
 ctx.font=((11*dpr)|0)+'px monospace';ctx.textAlign='left';
 for(let t=Math.ceil(s0/step)*step;t<=s1;t+=step){
  const x=xOf(t);
  ctx.strokeStyle='#232a33';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  ctx.fillStyle='#67717d';ctx.fillText(fmtTick(t,step),x+3*dpr,H-4*dpr);
 }
 /* 波形 */
 const sr=audioBuf.sampleRate,nB=peaksMin.length,data=audioBuf.getChannelData(0);
 const spp=dur/W*sr;
 ctx.fillStyle='#4fc3f7';
 if(spp>=BLOCK){
  for(let x=0;x<W;x++){
   let b0=Math.floor(tOf(x)*sr/BLOCK),b1=Math.ceil(tOf(x+1)*sr/BLOCK);
   b0=Math.max(0,b0);b1=Math.min(nB,Math.max(b1,b0+1));
   let mn=Infinity,mx=-Infinity;
   for(let b=b0;b<b1;b++){if(peaksMin[b]<mn)mn=peaksMin[b];if(peaksMax[b]>mx)mx=peaksMax[b];}
   const y1=mid-mx*amp,y2=mid-mn*amp;
   ctx.fillRect(x,y1,1,Math.max(1,y2-y1));
  }
 }else{
  ctx.beginPath();
  const iA=Math.max(0,Math.floor(s0*sr)),iB=Math.min(audioBuf.length,Math.ceil(s1*sr));
  for(let i=iA;i<iB;i++){const y=mid-data[i]*amp,x=xOf(i/sr);if(i===iA)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
  ctx.strokeStyle='#4fc3f7';ctx.lineWidth=Math.max(1,dpr);ctx.stroke();
 }
 /* A/B 區間 */
 if(region.a!=null&&region.b!=null){
  const xa=xOf(Math.min(region.a,region.b)),xb=xOf(Math.max(region.a,region.b));
  ctx.fillStyle='rgba(255,183,77,.13)';ctx.fillRect(xa,0,Math.max(1,xb-xa),H);
 }
 if(region.a!=null)vLine(ctx,xOf(region.a),'#ffb74d',H,dpr);
 if(region.b!=null)vLine(ctx,xOf(region.b),'#ffb74d',H,dpr);
 /* Markers */
 ctx.textAlign='center';
 markers.forEach((t,i)=>{
  const x=xOf(t);if(x<-20||x>W+20)return;
  vLine(ctx,x,'#ef7b7b',H,dpr);
  ctx.fillStyle='#ef7b7b';ctx.fillRect(x-8*dpr,0,16*dpr,14*dpr);
  ctx.fillStyle='#101216';ctx.font='bold '+((9*dpr)|0)+'px sans-serif';
  ctx.fillText(String(i+1),x,11*dpr);
 });
 /* Cursor */
 const cx=xOf(cursorSec);
 vLine(ctx,cx,'#ffffff',H,dpr);
 ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(cx-6*dpr,0);ctx.lineTo(cx+6*dpr,0);ctx.lineTo(cx,10*dpr);ctx.fill();
 $('viewRange').textContent=fmtShort(s0)+' — '+fmtShort(s1)+(dur<1?' ('+Math.round(dur*1000)+' ms)':dur<600?' ('+dur.toFixed(1)+' s)':'');
}
/* ================= Overview 繪圖 ================= */
function drawOv(){
 const dpr=fitCanvas(ovCv),ctx=ovCv.getContext('2d'),W=ovCv.width,H=ovCv.height;
 ctx.clearRect(0,0,W,H);
 if(!audioBuf)return;
 const D=audioBuf.duration,mid=H*0.55,amp=H*0.4,nB=peaksMin.length;
 ctx.fillStyle='#3d8fb5';
 for(let x=0;x<W;x++){
  const b0=Math.floor(x/W*nB),b1=Math.max(b0+1,Math.floor((x+1)/W*nB));
  let mn=Infinity,mx=-Infinity;
  for(let b=b0;b<b1;b++){if(peaksMin[b]<mn)mn=peaksMin[b];if(peaksMax[b]>mx)mx=peaksMax[b];}
  const y1=mid-mx*amp,y2=mid-mn*amp;
  ctx.fillRect(x,y1,1,Math.max(1,y2-y1));
 }
 ctx.fillStyle='rgba(255,255,255,.08)';
 ctx.fillRect(view.start/D*W,0,(view.end-view.start)/D*W,H);
 ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,dpr);
 ctx.strokeRect(view.start/D*W,0,(view.end-view.start)/D*W,H);
 vLine(ctx,cursorSec/D*W,'#ffb74d',H,dpr);
 ctx.strokeStyle='#ef7b7b';
 markers.forEach(t=>{const x=t/D*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();});
}
/* ================= 播放引擎 ================= */
function stopNode(){if(srcNode){try{srcNode.onended=null;srcNode.stop();}catch(e){}srcNode=null;}}
function curPos(){return playing?offAtStart+(actx.currentTime-startCtxT):cursorSec;}
function play(from){
 if(!audioBuf)return;
 stopNode();ensureAC();
 from=Math.max(0,Math.min(from,audioBuf.duration));
 srcNode=actx.createBufferSource();srcNode.buffer=audioBuf;srcNode.connect(gainNode);
 offAtStart=from;startCtxT=actx.currentTime;manualStop=false;
 srcNode.onended=()=>{
  if(manualStop)return;
  if(loopAB&&region.a!=null&&region.b!=null){play(Math.min(region.a,region.b));return;}
  playing=false;cursorSec=audioBuf.duration;$('playBtn').textContent='▶';updTime();drawMain();drawOv();
 };
 srcNode.start(0,from);
 playing=true;$('playBtn').textContent='⏸';
 tick();
}
function pause(){
 if(!playing)return;
 manualStop=true;stopNode();
 cursorSec=curPos();playing=false;
 $('playBtn').textContent='▶';updTime();drawMain();drawOv();
}
function togglePlay(){
 if(!audioBuf)return;
 if(playing)pause();
 else play(cursorSec>=audioBuf.duration-0.01?0:cursorSec);
}
function tick(){
 if(!playing)return;
 cursorSec=curPos();
 if($('followChk').checked){
  const dur=view.end-view.start;
  if(cursorSec>view.end-dur*0.04||cursorSec<view.start){
   view.start=Math.max(0,cursorSec-dur*0.1);view.end=view.start+dur;clampView();
  }
 }
 updTime();drawMain();drawOv();
 rafId=requestAnimationFrame(tick);
}
let rafId=0;
function setCursor(t){if(!audioBuf)return;cursorSec=Math.max(0,Math.min(t,audioBuf.duration));updTime();drawMain();drawOv();}
function updTime(){$('tCur').textContent=fmt(cursorSec);}
function nudge(dt){const t=(playing?curPos():cursorSec)+dt;if(playing)play(t);else setCursor(t);}

/* ================= 主畫布手勢 ================= */
const ptrs=new Map();let panRef=null,pinchRef=null,moved=false;
function clampView(){
 const D=audioBuf.duration;
 let dur=view.end-view.start;
 dur=Math.min(D,Math.max(0.02,dur));
 view.start=Math.max(0,Math.min(view.start,D-dur));
 view.end=view.start+dur;
}
function zoomAround(focusT,factor){
 const dur=view.end-view.start;
 let nd=dur*factor;
 nd=Math.min(audioBuf.duration,Math.max(0.02,nd));
 const ratio=(focusT-view.start)/dur;
 view.start=focusT-ratio*nd;view.end=view.start+nd;
 clampView();drawMain();drawOv();
}
mainCv.addEventListener('pointerdown',e=>{
 if(!audioBuf)return;
 mainCv.setPointerCapture(e.pointerId);
 ptrs.set(e.pointerId,{x:e.offsetX});moved=false;
 if(ptrs.size===1){panRef={x:e.offsetX,s:view.start,e:view.end};}
 else if(ptrs.size===2){
  const xs=[...ptrs.values()].map(p=>p.x);
  pinchRef={dist:Math.abs(xs[0]-xs[1])||1,dur:view.end-view.start,center:(view.start+view.end)/2};
  panRef=null;
 }
});
mainCv.addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId))return;
 const rec=ptrs.get(e.pointerId),prevX=rec.x;rec.x=e.offsetX;
 if(pinchRef&&ptrs.size===2){
  const xs=[...ptrs.values()].map(p=>p.x),dist=Math.abs(xs[0]-xs[1])||1;
  const nd=Math.min(audioBuf.duration,Math.max(0.02,pinchRef.dur*pinchRef.dist/dist));
  view.start=pinchRef.center-nd/2;view.end=pinchRef.center+nd/2;
  clampView();moved=true;drawMain();drawOv();return;
 }
 if(ptrs.size===1&&panRef){
  const tot=e.offsetX-panRef.x;
  if(Math.abs(tot)>6)moved=true;
  if(moved){
   const dtPerPx=(panRef.e-panRef.s)/mainCv.clientWidth;
   view.start=panRef.s-tot*dtPerPx;view.end=panRef.e-tot*dtPerPx;
   clampView();drawMain();drawOv();
  }
 }
});
function endPtr(e){
 if(!ptrs.has(e.pointerId))return;
 ptrs.delete(e.pointerId);
 if(ptrs.size===0){
  if(pinchRef){pinchRef=null;panRef=null;return;}
  if(panRef&&!moved&&audioBuf){
   const r=mainCv.getBoundingClientRect();
   const t=view.start+(e.clientX-r.left)/r.width*(view.end-view.start);
   setCursor(t);
  }
  panRef=null;
 }
}
mainCv.addEventListener('pointerup',endPtr);
mainCv.addEventListener('pointercancel',endPtr);
mainCv.addEventListener('wheel',e=>{
 if(!audioBuf)return;e.preventDefault();
 const r=mainCv.getBoundingClientRect();
 const focusT=view.start+(e.clientX-r.left)/r.width*(view.end-view.start);
 zoomAround(focusT,e.deltaY<0?0.75:1.33);
},{passive:false});

/* Overview：撳／拖嚟移動可見範圍 */
let ovDrag=false;
ovCv.addEventListener('pointerdown',e=>{if(!audioBuf)return;ovDrag=true;ovCv.setPointerCapture(e.pointerId);seekOv(e);});
ovCv.addEventListener('pointermove',e=>{if(ovDrag&&ovCv.hasPointerCapture&&ovCv.hasPointerCapture(e.pointerId))seekOv(e);});
ovCv.addEventListener('pointerup',()=>{ovDrag=false;});
ovCv.addEventListener('pointercancel',()=>{ovDrag=false;});
function seekOv(e){
 const r=ovCv.getBoundingClientRect();
 const t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audioBuf.duration;
 const half=(view.end-view.start)/2;
 view.start=t-half;view.end=t+half;
 clampView();drawMain();drawOv();
}

/* ================= Transport 掣與時間跳轉 ================= */
$('playBtn').addEventListener('click',togglePlay);
$('back5').onclick=()=>nudge(-5);
$('back1').onclick=()=>nudge(-1);
$('fwd1').onclick=()=>nudge(1);
$('fwd5').onclick=()=>nudge(5);
$('zoomIn').onclick=()=>zoomAround(playing?curPos():((view.start+view.end)/2),0.55);
$('zoomOut').onclick=()=>zoomAround((view.start+view.end)/2,1.8);
$('zoomFit').onclick=()=>{if(!audioBuf)return;view={start:0,end:audioBuf.duration};drawMain();drawOv();};
function doJump(){
 if(!audioBuf)return toast('請先載入音訊檔');
 const v=parseTime($('timeJump').value);
 if(v==null)return toast('❌ 時間格式唔啱，例：1:23:45.5');
 setCursor(v);
 if(playing)play(cursorSec);
}
$('jumpBtn').onclick=doJump;
$('timeJump').addEventListener('keydown',e=>{if(e.key==='Enter')doJump();});
document.addEventListener('keydown',e=>{
 if(e.code==='Space'&&audioBuf&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();togglePlay();}
});
/* ================= Marker 與 A/B 區間 ================= */
$('addMarkBtn').onclick=()=>{
 if(!audioBuf)return toast('請先載入音訊檔');
 const t=playing?curPos():cursorSec;
 markers.push(t);markers.sort((a,b)=>a-b);
 renderMarks();drawMain();drawOv();
 toast('🚩 Marker #'+markers.length+' @ '+fmtShort(t));
};
$('clearMarksBtn').onclick=()=>{markers=[];renderMarks();drawMain();drawOv();};
$('segsFromMarksBtn').onclick=()=>{
 if(markers.length<2)return toast('至少要有 2 個 Marker 先可以生成段落');
 segments=markers.slice(0,-1).map((t,i)=>({start:t,end:markers[i+1]}));
 renderSegs();toast('⚙ 已由 '+markers.length+' 個 Marker 生成 '+segments.length+' 段');
};
function renderMarks(){
 $('markList').innerHTML=markers.length?('Markers（'+markers.length+'）：'+markers.map((t,i)=>'#'+(i+1)+' '+fmtShort(t)).join(' · ')):'（未有任何 Marker）';
}
$('setA').onclick=()=>{if(!audioBuf)return;region.a=playing?curPos():cursorSec;updateRegionInfo();drawMain();};
$('setB').onclick=()=>{if(!audioBuf)return;region.b=playing?curPos():cursorSec;updateRegionInfo();drawMain();};
$('loopBtn').onclick=function(){
 if(!audioBuf)return;
 if(region.a==null||region.b==null)return toast('先設 A 同 B 點');
 loopAB=!loopAB;
 this.textContent=loopAB?'⏹ 停止循環':'🔁 A–B 循環預覽';
 if(loopAB)play(Math.min(region.a,region.b));else pause();
 updateRegionInfo();
};
$('segFromAB').onclick=()=>{
 if(region.a==null||region.b==null)return toast('先設 A 同 B 點');
 segments.push({start:Math.min(region.a,region.b),end:Math.max(region.a,region.b)});
 segments.sort((a,b)=>a.start-b.start);
 renderSegs();toast('➕ 已加入段落 #'+segments.length);
};
function updateRegionInfo(){
 $('regionInfo').textContent='A/B 區間：'+(region.a!=null?'A='+fmtShort(region.a):'A 未設')+' · '+(region.b!=null?'B='+fmtShort(region.b):'B 未設')+(loopAB?'（循環中）':'');
}

/* ================= 段落清單 ================= */
function renderSegs(){
 const el=$('segList');el.innerHTML='';
 $('segCount').textContent=segments.length?('共 '+segments.length+' 段，總長 '+fmtShort(segments.reduce((a,s)=>a+(s.end-s.start),0))):'尚未有段落';
 segments.forEach((sg,i)=>{
  const row=document.createElement('div');row.className='segitem';
  const idx=document.createElement('span');idx.className='idx';idx.textContent=pad(i+1,2);
  const si=document.createElement('input'),ei=document.createElement('input');
  si.value=fmt(sg.start);ei.value=fmt(sg.end);
  const apply=()=>{
   const a=parseTime(si.value),b=parseTime(ei.value);
   if(a==null||b==null)return toast('❌ 時間格式唔啱');
   if(b<=a)return toast('❌ 結束時間要大過開始');
   sg.start=a;sg.end=b;renderSegs();drawMain();
  };
  si.onchange=apply;ei.onchange=apply;
  const durEl=document.createElement('span');durEl.className='dur';durEl.textContent=Math.max(0,sg.end-sg.start).toFixed(2)+'s';
  const pb=document.createElement('button');pb.textContent='▶';pb.title='預覽呢段';
  pb.onclick=()=>{region={a:sg.start,b:sg.end};updateRegionInfo();play(sg.start);};
  const db=document.createElement('button');db.textContent='✕';db.className='warnbtn';db.title='刪除';
  db.onclick=()=>{segments.splice(i,1);renderSegs();};
  row.append(idx,si,ei,durEl,pb,db);
  el.appendChild(row);
 });
}
$('clearSegs').onclick=()=>{if(segments.length&&confirm('確定清空全部段落？')){segments=[];renderSegs();}};
/* ================= 匯出：MP3 / WAV ================= */
let lamePromise=null;
function loadLame(){
 if(window.lame)return Promise.resolve(window.lame);
 if(lamePromise)return lamePromise;
 const urls=[
  'https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js',
  'https://unpkg.com/lamejs@1.2.1/lame.min.js'
 ];
 lamePromise=(async()=>{
  for(const u of urls){
   try{
    await new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s);});
    if(window.lame)return window.lame;
   }catch(err){/* 試下一個 CDN */}
  }
  return null;
 })();
 return lamePromise;
}
function sliceI16(start,end){
 const sr=audioBuf.sampleRate;
 const s=Math.max(0,Math.floor(start*sr)),e=Math.min(audioBuf.length,Math.ceil(end*sr)),len=Math.max(1,e-s);
 const nch=Math.min(audioBuf.numberOfChannels,2),out=[];
 for(let c=0;c<nch;c++){
  const d=audioBuf.getChannelData(c),a=new Int16Array(len);
  for(let i=0;i<len;i++){let v=d[s+i];if(v>1)v=1;else if(v<-1)v=-1;a[i]=v<0?v*32768:v*32767;}
  out.push(a);
 }
 return out;
}
function encodeWav(start,end){
 const chans=sliceI16(start,end),n=chans[0].length,c=chans.length,sr=audioBuf.sampleRate;
 const bytes=44+n*c*2,buf=new ArrayBuffer(bytes),dv=new DataView(buf);
 const ws=(o,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(o+i,str.charCodeAt(i));};
 ws(0,'RIFF');dv.setUint32(4,bytes-8,true);ws(8,'WAVE');ws(12,'fmt ');
 dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,c,true);
 dv.setUint32(24,sr,true);dv.setUint32(28,sr*c*2,true);dv.setUint16(32,c*2,true);dv.setUint16(34,16,true);
 ws(36,'data');dv.setUint32(40,n*c*2,true);
 let off=44;
 for(let i=0;i<n;i++)for(let ch=0;ch<c;ch++,off+=2)dv.setInt16(off,chans[ch][i],true);
 return new Blob([buf],{type:'audio/wav'});
}
function encodeMp3(start,end,kbps,L){
 const chans=sliceI16(start,end),n=chans[0].length,sr=audioBuf.sampleRate;
 const enc=new L.Mp3Encoder(chans.length,sr,kbps),parts=[],BLK=1152;
 for(let i=0;i<n;i+=BLK){
  const l=chans[0].subarray(i,i+BLK);
  const r=chans.length>1?chans[1].subarray(i,i+BLK):null;
  const d=enc.encodeBuffer(l,r);
  if(d.length)parts.push(new Uint8Array(d));
 }
 const fin=enc.flush();
 if(fin.length)parts.push(new Uint8Array(fin));
 return new Blob(parts,{type:'audio/mpeg'});
}
function download(blob,name){
 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},800);
}
$('exportBtn').onclick=async()=>{
 if(!audioBuf||!segments.length)return toast('冇段落可以匯出，請先加段落');
 stopNode();playing=false;$('playBtn').textContent='▶';
 const wantMp3=document.querySelector('input[name=fmt]:checked').value==='mp3';
 const kbps=parseInt($('kbps').value,10);
 let L=null;
 if(wantMp3){
  busy(true,'載入 MP3 編碼器…');
  L=await loadLame();busy(false);
  if(!L){toast('❌ 載入 MP3 編碼器失敗（可能離線），請改用 WAV 格式',true);return;}
 }
 $('exportBtn').disabled=true;
 let done=0;
 try{
  for(let i=0;i<segments.length;i++){
   const st=Math.min(segments[i].start,segments[i].end),en=Math.max(segments[i].start,segments[i].end);
   if(en-st<=0.001)continue;
   busy(true,'匯出中… 第 '+(i+1)+' / '+segments.length+' 段');
   await sleep(30);
   const blob=wantMp3?encodeMp3(st,en,kbps,L):encodeWav(st,en);
   busy(false);
   download(blob,baseName+'_seg'+pad(i+1,2)+'_'+fmtStamp(st)+'-'+fmtStamp(en)+'.'+(wantMp3?'mp3':'wav'));
   done++;
   $('progbar').style.width=Math.min(100,Math.round(done/Math.max(1,segments.length)*100))+'%';
   await sleep(450);
  }
  $('expStatus').textContent='✅ 完成！已觸發下載 '+done+' 個檔案。';
  toast('🎉 已匯出 '+done+' 個檔案',true);
 }catch(err){
  console.error(err);alert('匯出出錯：'+err.message);
 }finally{$('exportBtn').disabled=false;busy(false);}
};

/* ================= 啟動 ================= */
resizeAll();
</script>
</body>
</html>
